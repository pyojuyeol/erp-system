name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Backend - Install & Build
        working-directory: ./backend
        run: |
          npm ci
          DATABASE_URL="postgresql://dummy:dummy@localhost:5432/dummy" npx prisma generate
          npm run build

      - name: Frontend - Install & Build
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create backend .env.docker
        working-directory: ./backend
        run: |
          cat > .env.docker << 'ENVEOF'
          PORT=4000
          NODE_ENV=production
          DATABASE_URL="postgresql://erp_user:erp_password@postgres:5432/erp_db?schema=public"
          REDIS_HOST=redis
          REDIS_PORT=6379
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN=15m
          JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
          JWT_REFRESH_EXPIRES_IN=7d
          CORS_ORIGIN=http://localhost:8090
          ENVEOF

      - name: Backup current images (for rollback)
        run: |
          docker tag erp-backend:latest erp-backend:previous 2>/dev/null || echo "이전 backend 이미지 없음 (최초 배포)"
          docker tag erp-frontend:latest erp-frontend:previous 2>/dev/null || echo "이전 frontend 이미지 없음 (최초 배포)"

      - name: Build new images
        run: docker compose build

      - name: Deploy new version
        run: docker compose up -d

      - name: Run DB migrations
        run: docker compose exec -T backend npx prisma migrate deploy

      - name: Health check (with retry)
        id: healthcheck
        run: |
          echo "헬스체크 시작..."
          for i in $(seq 1 10); do
            BACKEND_OK=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/api/health || echo "000")
            FRONTEND_OK=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8090 || echo "000")
            echo "시도 $i/10 - backend: $BACKEND_OK, frontend: $FRONTEND_OK"
            if [ "$BACKEND_OK" = "200" ] && [ "$FRONTEND_OK" = "200" ]; then
              echo "헬스체크 통과"
              exit 0
            fi
            sleep 3
          done
          echo "헬스체크 실패 - 10회 시도 후에도 정상 응답 없음"
          exit 1

      - name: Rollback on failure
        if: failure() && steps.healthcheck.outcome == 'failure'
        run: |
          echo "배포 실패 감지 - 이전 버전으로 롤백합니다"
          if docker image inspect erp-backend:previous >/dev/null 2>&1; then
            docker tag erp-backend:previous erp-backend:latest
            docker tag erp-frontend:previous erp-frontend:latest
            docker compose up -d --force-recreate backend frontend
            echo "롤백 완료 - 이전 버전으로 서비스가 복구되었습니다"
          else
            echo "롤백할 이전 버전이 없습니다 (최초 배포 실패로 추정). 수동 확인이 필요합니다."
          fi

      - name: Final status
        if: always()
        run: docker compose ps
